name: API CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check --workspace=@tomowa/api

      - name: Validate OpenAPI
        run: npm run openapi:lint --workspace=@tomowa/api

      - name: Lint
        run: npm run lint --workspace=@tomowa/api

      - name: Build
        run: npm run build --workspace=@tomowa/api

      - name: Type-check tests
        run: npm run test:typecheck --workspace=@tomowa/api

      - name: Run unit tests
        run: npm run test:unit --workspace=@tomowa/api
